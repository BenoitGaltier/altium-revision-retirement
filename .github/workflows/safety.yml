name: Safety tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  safety:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run isolated safety engine tests
        shell: powershell
        run: .\scripts\test.ps1
      - name: Verify English interface and selection controls
        shell: powershell
        run: .\scripts\test-ui.ps1
      - name: Verify compiled installation and packaging with isolated fixtures
        shell: powershell
        run: .\tests\InstallerTests.ps1
